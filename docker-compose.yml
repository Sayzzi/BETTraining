services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bettraining
      POSTGRES_PASSWORD: bettraining
      POSTGRES_DB: bettraining
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bettraining -d bettraining"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: builder
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://bettraining:bettraining@db:5432/bettraining
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://bettraining:bettraining@db:5432/bettraining
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: http://localhost:3000
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Throwaway database for integration and end-to-end tests.
  db-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bettraining
      POSTGRES_PASSWORD: bettraining
      POSTGRES_DB: bettraining_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bettraining -d bettraining_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
